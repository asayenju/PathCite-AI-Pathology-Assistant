[pytest]
testpaths = tests
markers =
    hf: network smoke eval on a Hugging Face dataset (opt-in: pytest -m hf)
    jev: live Jev (TypeSafe) triage eval, needs JEV_KEY (opt-in: pytest -m jev)
    corpus: live corpus ingest smoke test against Supabase and OpenAI (opt-in: pytest -m corpus)
# The hf, jev and corpus tests are skipped by default; `pytest -m hf`, `-m jev` or `-m corpus` (given later) overrides this.
addopts = -m "not hf and not jev and not corpus"

[pytest]
testpaths = tests
markers =
    hf: network smoke eval on a Hugging Face dataset (opt-in: pytest -m hf)
    jev: live Jev (TypeSafe) triage eval, needs JEV_KEY (opt-in: pytest -m jev)
    corpus: live corpus ingest smoke test against Supabase and OpenAI (opt-in: pytest -m corpus)
    check: live RAG claim checker tests against OpenAI / Supabase / Jev (opt-in: pytest -m check)
# The hf, jev, corpus and check tests are skipped by default; `pytest -m hf`, `-m jev`, `-m corpus` or `-m check`
# (given later) overrides this.
addopts = -m "not hf and not jev and not corpus and not check"

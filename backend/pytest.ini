[pytest]
testpaths = tests
markers =
    hf: network smoke eval on a Hugging Face dataset (opt-in: pytest -m hf)
    jev: live Jev (TypeSafe) triage eval, needs JEV_KEY (opt-in: pytest -m jev)
# The hf and jev tests are skipped by default; `pytest -m hf` or `pytest -m jev` (given later) overrides this.
addopts = -m "not hf and not jev"
